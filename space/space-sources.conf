# Source registry for the space video wallpaper.
#
# Sourced by both space-capture-loop.sh and space-watchdog.sh so that the
# capture backend and the failover policy always agree on what exists.
# Adding or retiring a feed is a one-line edit here; no logic changes.
#
# source_def <id> sets:
#   SRC_KIND    youtube | imgseq
#   SRC_NAME    human-readable, for logs
#   SRC_YTID    (youtube) YouTube video id
#   SRC_PROTO   (imgseq)  goes | himawari | epic  — which fetcher to use
#   SRC_ARG     (imgseq)  fetcher-specific argument
#   SRC_FRAMES  (imgseq)  frames per loop
#   SRC_FPS     (imgseq)  playback frame rate
#
# Verified live 2026-08-02; YouTube IDs re-verified 2026-11-20. Deliberately excluded:
#   Dream Trips (all streams) — checked 2026-11-20: daylight Earth while the ISS
#   was in darkness, one a composite with a capsule pasted over Earth. Fake.
#   Note: Sen sometimes airs promo trailers; the brightness check cannot tell.
#   TAkk2B9GOmc (Tripwebcam) — live, but overlaid with orbit-tracker telemetry.
#   Any "Mars/Moon 24/7 live" channel — all are looped archival stills. There is
#   no genuine live video from Mars or the Moon; the light-time delay and
#   scheduled batch downlinks make it physically impossible today.

SOURCES=(nasa-iss sen-4k afartv-iss goes-east goes-west himawari epic)

source_def() {
    SRC_KIND=""; SRC_NAME=""; SRC_YTID=""
    SRC_PROTO=""; SRC_ARG=""; SRC_FRAMES=""; SRC_FPS=""
    case "$1" in
        # --- Genuinely live video, via yt-dlp (shared failure mode) ---
        sen-4k)
            SRC_KIND=youtube; SRC_NAME="Sen 4K — ISS"
            SRC_YTID="fO9e9jnhYK8" ;;
        nasa-iss)
            SRC_KIND=youtube; SRC_NAME="NASA — ISS HD"
            SRC_YTID="ROboUHfPUrU" ;;
        afartv-iss)
            # Relays NASA's camera, so it drops out when NASA does; Sen is the
            # only feed with an independent source.
            SRC_KIND=youtube; SRC_NAME="afarTV — ISS (NASA relay)"
            SRC_YTID="tj4knR4r1UU" ;;

        # --- Satellite imagery over plain HTTPS (no yt-dlp) ---
        # 60 frames x 10 min = 10 hours of cloud motion per loop.
        goes-east)
            SRC_KIND=imgseq; SRC_NAME="GOES-19 — Americas & Atlantic"
            SRC_PROTO=goes; SRC_ARG="GOES19"; SRC_FRAMES=60; SRC_FPS=10 ;;
        goes-west)
            SRC_KIND=imgseq; SRC_NAME="GOES-18 — Pacific"
            SRC_PROTO=goes; SRC_ARG="GOES18"; SRC_FRAMES=60; SRC_FPS=10 ;;
        himawari)
            SRC_KIND=imgseq; SRC_NAME="Himawari — Asia-Pacific"
            SRC_PROTO=himawari; SRC_ARG="2d"; SRC_FRAMES=60; SRC_FPS=10 ;;
        # EPIC lags 1-3 days — one full Earth rotation, not a live view.
        epic)
            SRC_KIND=imgseq; SRC_NAME="DSCOVR EPIC — full sunlit disk"
            SRC_PROTO=epic; SRC_ARG="natural"; SRC_FRAMES=22; SRC_FPS=6 ;;
        *) return 1 ;;
    esac
    return 0
}

# Kind of a source id, without disturbing the caller's SRC_* variables.
kind_of() (
    source_def "$1" >/dev/null 2>&1 || return 1
    echo "$SRC_KIND"
)
